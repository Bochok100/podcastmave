name: Deploy Bot to Contabo

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем свежий код
        uses: actions/checkout@v3

      - name: Копируем файлы на сервер
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SERVER_PASS }}
          source: "bot.py,requirements.txt,Dockerfile"
          target: "/root/podcast_bot"

      - name: Перезапускаем Docker на сервере
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SERVER_PASS }}
          script: |
            cd /root/podcast_bot
            docker build -t podcast_bot .
            docker rm -f my_adobe_bot || true
            docker run -d --name my_adobe_bot --restart unless-stopped --env-file .env podcast_bot
